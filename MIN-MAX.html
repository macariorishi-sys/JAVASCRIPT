<html>
    <body>
        <script>
            let n1=prompt("Enter first no:");
            let n2=prompt("Enter second no:");
            document.write(Math.min(n1,n2)+ ' is the min number'+ "<br>");
            document.write(Math.max(n1,n2)+ ' is the max number'+ "<br>");
            var fact=1
            for(var i=1;i<=n1;i++)
                fact=fact*i
                document.write(fact)
            
        </script>
    </body>
</html>
